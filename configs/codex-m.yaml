# CoDEx-M. Paths are relative to the repository root unless absolute.

dataset: CoDEx-M

# SimKGC's --task. Upstream SimKGC accepts only wn18rr / fb15k237 / wiki5m_*. Its only
# task-specific text processing is the WordNet name parsing done for wn18rr, which would
# erase CoDEx-M entity names; fb15k237 keeps them intact and is otherwise identical.
simkgc_task: fb15k237

simkgc_data_dir: data/raw/CoDEx-M          # SimKGC-format JSON (train/valid/test.txt.json, entities.json)
mining_dir: data/mining/CoDEx-M            # candidate shards from scripts/mine_candidates.py
output_dir: checkpoints/reranker/CoDEx-M   # cross-encoder checkpoints from scripts/train_reranker.py

# Bi-encoder (SimKGC). The paper uses the epoch-7 checkpoint of a run trained with
# SimKGC's FB15k-237 recipe (scripts/train_fb.sh upstream); `biencoder` reproduces it.
biencoder_checkpoint: checkpoints/biencoder/CoDEx-M/checkpoint_epoch7.mdl
biencoder:
  pooling: mean
  lr: 1.0e-5
  batch_size: 1024
  epochs: 10
  additive_margin: 0.02
  pre_batch: 2
  use_self_negative: true
  finetune_t: true
  use_link_graph: true
  use_amp: true

# Cross-encoder reranker
pretrained_model: bert-base-uncased
top_k: 50                       # candidates per query, in training and at test time
max_length: 128                 # pairs: median 28, max 75 tokens (no truncation)
per_device_train_batch_size: 16
gradient_accumulation_steps: 2  # effective batch: 32 queries
num_train_epochs: 4
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0
bf16: true

# Selected on the validation split by scripts/evaluate.py
gate_threshold_grid: [0, 1, 9, 99, 999, 10000]   # T = other known training answers; rerank iff T <= threshold
alpha_grid_step: 0.05
